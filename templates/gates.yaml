# Starter gate DAG — adapt per project.
# Contract: https://github.com/PCSchmidt/portfolio-kit/blob/main/docs/GATE_CONTRACT.md

version: "1.0"

project:
  name: "example-project"
  recipe: "custom"
  description: "Phase-0 starter DAG"

gates:
  - id: confirmed
    label: "Scope Confirmed"
    type: human_approval
    required: true
    approval_token: "CONFIRMED"
    requires: []
    requires_artifacts:
      - CONTRACT.md
      - SPEC.md
    hooks:
      pre: []
      post: []
    emits: CONFIRMED_GATE.json
    on_fail: block_all_writes

  - id: tests_passing
    label: "Tests Passing"
    type: automated
    required: true
    requires:
      - confirmed
    hooks:
      pre: []
    pass_condition: "exit_code == 0"
    emits: TEST_GATE.json
    on_fail: block_gate_writes

  - id: evaluated
    label: "Independent Evaluator Pass"
    type: automated
    required: true
    requires:
      - tests_passing
    hooks:
      pre: []
    emits: EVALUATOR_GATE.json
    on_fail: block_all_writes
