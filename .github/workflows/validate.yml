name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate schemas and examples
        run: python eval/validate_schemas.py
